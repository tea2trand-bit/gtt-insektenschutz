[build]
  command = "npm run build"
  publish = "dist"

[functions]
  external_node_modules = ["pdfkit"]
  included_files = ["netlify/assets/fonts/DejaVuSans.ttf"]

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
